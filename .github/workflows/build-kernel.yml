name: Build Container-Supported Kernel (LG G8)

on:
    workflow_dispatch:
        inputs:
            kernel_branch:
                description: "Kernel branch to build"
                required: true
                default: "lineage-22.2"
            defconfig_path:
                description: "Path to defconfig (relative to kernel root)"
                required: true
                default: "vendor/lineageos_flash_defconfig"
env:
    KERNEL_REPO: "LineageOS/android_kernel_lge_sm8150"
    ARCH: arm64
    SUBARCH: arm64
    CLANG_VERSION: "r510928" # lineage-22.2 (Android 15) 推荐版本
    GCC64_VERSION: "master"
    GCC32_VERSION: "master"

jobs:
    build:
        runs-on: ubuntu-22.04
        timeout-minutes: 120

        steps:
            # ============ 1. 拉取内核源码 ============
            - name: Checkout kernel source
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.KERNEL_REPO }}
                  ref: ${{ github.event.inputs.kernel_branch }}
                  path: kernel
                  fetch-depth: 1

            # ============ 2. 安装编译依赖 ============
            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    bc bison build-essential ccache curl flex git gnupg gperf \
                    imagemagick lib32readline-dev lib32z1-dev libdw-dev libelf-dev \
                    libgnutls28-dev liblz4-tool libsdl1.2-dev libssl-dev \
                    libxml2 libxml2-utils lzop pngcrush rsync schedtool \
                    squashfs-tools xsltproc zip zlib1g-dev \
                    python3 python-is-python3 libncurses5-dev libncursesw5-dev
                  # Ubuntu 22.04 需要额外安装旧版 libncurses/libtinfo
                  sudo apt-get install -y libncurses5 libtinfo5 || true

            # ============ 3. ccache 缓存，加速二次编译 ============
            - name: Setup ccache
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: sm8150-${{ github.event.inputs.kernel_branch }}
                  max-size: 2G

            # ============ 4. 下载工具链 ============
            - name: Clone toolchains
              run: |
                  # AOSP Clang
                  git clone --depth=1 \
                    https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
                    -b ${{ env.CLANG_VERSION }} /tmp/clang
                  # AArch64 GCC 4.9
                  git clone --depth=1 \
                    https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
                    -b ${{ env.GCC64_VERSION }} /tmp/gcc64
                  # ARM GCC 4.9
                  git clone --depth=1 \
                    https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
                    -b ${{ env.GCC32_VERSION }} /tmp/gcc32

                  echo "/tmp/clang/bin"     >> $GITHUB_PATH
                  echo "/tmp/gcc64/bin"     >> $GITHUB_PATH
                  echo "/tmp/gcc32/bin"     >> $GITHUB_PATH

            # ============ 5. 配置 + 注入容器支持 ============
            - name: Configure kernel with container support
              working-directory: ./kernel
              run: |
                  export PATH="/tmp/clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"
                  export CC=clang
                  export CLANG_TRIPLE=aarch64-linux-gnu-
                  export CROSS_COMPILE=aarch64-linux-android-
                  export CROSS_COMPILE_ARM32=arm-linux-androideabi-

                  # --- 5.1 生成基础 .config ---
                  make O=out ARCH=arm64 SUBARCH=arm64 \
                    ${{ github.event.inputs.defconfig_path }}

                  # --- 5.2 用 scripts/config 注入容器相关配置 ---
                  # 注意：这里只使用 --enable，不删除任何已有配置，避免破坏 defconfig
                  CFG="out/.config"

                  # Namespaces（容器隔离的核心）
                  ./scripts/config --file $CFG \
                    -e NAMESPACES \
                    -e NET_NS \
                    -e PID_NS \
                    -e IPC_NS \
                    -e UTS_NS \
                    -e USER_NS

                  # Control Groups（资源限制）
                  ./scripts/config --file $CFG \
                    -e CGROUPS \
                    -e CGROUP_DEVICE \
                    -e CGROUP_HUGETLB \
                    -e NET_CLS_CGROUP \
                    -e CGROUP_FREEZER \
                    -e CGROUP_SCHED \
                    -e CPUSETS \
                    -e MEMCG

                  # 网络相关（容器间通信）
                  ./scripts/config --file $CFG \
                    -e VETH \
                    -e BRIDGE \
                    -e BRIDGE_NETFILTER \
                    -e NF_NAT \
                    -e NETFILTER_XT_MATCH_ADDRTYPE \
                    -e NETFILTER_XT_MATCH_CONNTRACK \
                    -e NETFILTER_XT_MATCH_IPVS \
                    -e NETFILTER_XT_MARK \
                    -e NETFILTER_XT_NAT \
                    -e NETFILTER_XT_TARGET_MASQUERADE \
                    -e NETFILTER_XT_TARGET_REDIRECT \
                    -e IP_VS

                  # OverlayFS（Docker overlay2 存储驱动）
                  ./scripts/config --file $CFG -e OVERLAY_FS

                  # 部分配置项需要作为模块存在才能正确编译
                  ./scripts/config --file $CFG \
                    -m NETFILTER_XT_MATCH_ADDRTYPE \
                    -m NETFILTER_XT_MATCH_CONNTRACK \
                    -m NETFILTER_XT_MATCH_IPVS

                  # --- 5.3 让 make 自动处理依赖关系 ---
                  # olddefconfig 会用默认值填补未定义的依赖，避免交互式询问
                  make O=out ARCH=arm64 SUBARCH=arm64 olddefconfig

                  # --- 5.4 打印关键配置，验证是否生效 ---
                  echo "===== Container-related config check ====="
                  grep -E "CONFIG_(NAMESPACES|NET_NS|PID_NS|IPC_NS|UTS_NS|USER_NS|CGROUPS|CGROUP_DEVICE|MEMCG|VETH|BRIDGE|OVERLAY_FS|IP_VS)=" \
                    out/.config || true

            # ============ 6. 编译内核 ============
            - name: Build kernel
              working-directory: ./kernel
              run: |
                  export PATH="/tmp/clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"
                  export CC=clang
                  export CLANG_TRIPLE=aarch64-linux-gnu-
                  export CROSS_COMPILE=aarch64-linux-android-
                  export CROSS_COMPILE_ARM32=arm-linux-androideabi-

                  make -j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 \
                    CC=clang \
                    CLANG_TRIPLE=aarch64-linux-gnu- \
                    CROSS_COMPILE=aarch64-linux-android- \
                    CROSS_COMPILE_ARM32=arm-linux-androideabi-

            # ============ 7. 打包成可刷入的 ZIP ============
            - name: Package with AnyKernel3
              run: |
                  git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AnyKernel3
                  cd /tmp/AnyKernel3

                  # 拷贝内核产物
                  cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz-dtb .

                  # 可选：拷贝 dtbo，如果设备需要
                  if [ -f ${{ github.workspace }}/kernel/out/arch/arm64/boot/dtbo.img ]; then
                    cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/dtbo.img .
                  fi

                  # 清理并打包
                  rm -rf .git
                  zip -r9 kernel-flashlmdd-container.zip . -x "*.git*"

            # ============ 8. 上传产物 ============
            - name: Upload kernel package
              uses: actions/upload-artifact@v4
              with:
                  name: kernel-flashlmdd-container-${{ github.run_number }}
                  path: /tmp/AnyKernel3/kernel-flashlmdd-container.zip
                  retention-days: 7
