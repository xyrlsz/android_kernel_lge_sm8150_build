name: Build Container-Supported Kernel (LG V50) + boot.img Repack

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch to build"
        required: true
        default: "lineage-22.2"
      defconfig_path:
        description: "Path to defconfig (relative to kernel root)"
        required: true
        default: "vendor/lineageos_flash_defconfig"
      boot_img_path:
        description: "Path to prebuilt boot.img in this repo"
        required: true
        default: "prebuilt/boot.img"

env:
  KERNEL_REPO: "LineageOS/android_kernel_lge_sm8150"
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_DIR: /home/runner/.cache/ccache-kernel
  ZYC_CLANG_VERSION: "16.0.6-20260807"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ============ 1. 拉取本仓库 ============
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Verify boot.img exists
        run: |
          BOOT="${{ github.workspace }}/builder/${{ github.event.inputs.boot_img_path }}"
          if [ ! -f "$BOOT" ]; then
            echo "::error::boot.img not found at $BOOT"
            ls -laR ${{ github.workspace }}/builder/ | head -50
            exit 1
          fi
          echo "===== Original boot.img ====="
          ls -lh "$BOOT"
          file "$BOOT" || true

      # ============ 2. 拉取内核源码 ============
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ github.event.inputs.kernel_branch }}
          path: kernel
          fetch-depth: 1

      # ============ 3. 安装编译依赖 ============
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            lib32readline-dev lib32z1-dev libdw-dev libelf-dev \
            libgnutls28-dev liblz4-tool libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev unzip \
            python3 python-is-python3 python3-pip \
            libncurses5 libtinfo5

          echo "===== ccache version ====="
          ccache --version | head -1

      # ============ 4. ccache 缓存 ============
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache-kernel
          key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.kernel_branch }}-${{ env.ZYC_CLANG_VERSION }}-dwarf4-nopatch-${{ hashFiles('kernel/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.kernel_branch }}-${{ env.ZYC_CLANG_VERSION }}-dwarf4-
            ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.kernel_branch }}-${{ env.ZYC_CLANG_VERSION }}-
            ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.kernel_branch }}-
            ${{ runner.os }}-kernel-ccache-

      - name: Setup ccache environment
        shell: bash
        run: |
          mkdir -p "$CCACHE_DIR"

          {
            echo "CCACHE_DIR=$CCACHE_DIR"
            echo "CCACHE_MAXSIZE=5G"
            echo "CCACHE_COMPRESS=true"
            echo "CCACHE_COMPRESSLEVEL=6"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_ctime,include_file_mtime"
            echo "CCACHE_CPP2=true"
            echo "CCACHE_DEPEND=true"
          } >> $GITHUB_ENV

          echo "===== ccache 初始状态 ====="
          ccache -s
          ccache -p | grep -E "cache_dir|max_size|compression" || true

      # ============ 5. 下载 zyc-clang 工具链 ============
      - name: Setup zyc-clang toolchain
        shell: bash
        run: |
          echo "===== 下载 zyc-clang ${{ env.ZYC_CLANG_VERSION }} ====="

          mkdir -p /home/runner/zyc-clang
          cd /home/runner/zyc-clang

          wget -q \
            "https://github.com/ZyCromerZ/Clang/releases/download/${ZYC_CLANG_VERSION}-release/Clang-${ZYC_CLANG_VERSION}.tar.gz" \
            -O zyc-clang.tar.gz

          tar -zxf zyc-clang.tar.gz
          rm zyc-clang.tar.gz

          echo "===== zyc-clang 目录结构 ====="
          ls -la /home/runner/zyc-clang/

          echo "===== zyc-clang 版本 ====="
          /home/runner/zyc-clang/bin/clang --version

          echo "/home/runner/zyc-clang/bin" >> $GITHUB_PATH

      # ============ 6. 下载 GCC 4.9（4.14 内核仍需） ============
      - name: Clone GCC 4.9 toolchains
        shell: bash
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            /tmp/gcc64
          echo "/tmp/gcc64/bin" >> $GITHUB_PATH

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            /tmp/gcc32
          echo "/tmp/gcc32/bin" >> $GITHUB_PATH

          cd /tmp/gcc64/bin
          for f in aarch64-linux-android-4.9-*; do
            [ -e "$f" ] || continue
            ln -sf "$f" "${f/aarch64-linux-android-4.9-/aarch64-linux-android-}"
          done
          cd /tmp/gcc32/bin
          for f in arm-linux-androideabi-4.9-*; do
            [ -e "$f" ] || continue
            ln -sf "$f" "${f/arm-linux-androideabi-4.9-/arm-linux-androideabi-}"
          done

      # ============ 7. 验证工具链与 ccache ============
      - name: Verify toolchain and ccache
        shell: bash
        run: |
          export PATH="/home/runner/zyc-clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"

          echo "===== which clang ====="
          which clang
          echo "===== clang version ====="
          clang --version
          echo "===== which aarch64-linux-android-ld ====="
          which aarch64-linux-android-ld

          echo ""
          echo "===== 测试 ccache 拦截 clang ====="
          echo 'int main(){return 0;}' > /tmp/test.c
          ccache clang -c /tmp/test.c -o /tmp/test.o
          echo "第一次编译（miss）"
          ccache clang -c /tmp/test.c -o /tmp/test.o
          echo "第二次编译（hit）"

          echo ""
          echo "===== ccache 统计（应为 1 hit, 1 miss）====="
          ccache -s

      # ============ 8. 配置内核 + 注入容器支持 ============
      - name: Configure kernel
        working-directory: ./kernel
        run: |
          export PATH="/home/runner/zyc-clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "===== 环境检查 ====="
          echo "CCACHE_DIR=$CCACHE_DIR"
          which clang
          clang --version
          ccache -s

          # 生成 defconfig（-gdwarf-4 关键）
          make O=out ARCH=arm64 SUBARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            KCFLAGS="-gdwarf-4" \
            ${{ github.event.inputs.defconfig_path }}

          CFG="out/.config"

          # 禁用 DWARF v5
          ./scripts/config --file $CFG -d DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT

          # ============ 1. Namespaces ============
          ./scripts/config --file $CFG \
            -e NAMESPACES -e NET_NS -e PID_NS -e UTS_NS -e USER_NS \
            -e SYSVIPC -e POSIX_MQUEUE -e IPC_NS

          # ============ 2. devtmpfs ============
          ./scripts/config --file $CFG \
            -e DEVTMPFS -e DEVTMPFS_MOUNT

          # ============ 3. Cgroups ============
          ./scripts/config --file $CFG \
            -e CGROUPS -e CGROUP_DEVICE -e CGROUP_HUGETLB -e NET_CLS_CGROUP \
            -e CGROUP_FREEZER -e CGROUP_SCHED -e CPUSETS -e MEMCG \
            -e CGROUP_BPF -e CGROUP_PIDS -e CGROUP_NET_PRIO

          # ============ 4. 网络基础 ============
          ./scripts/config --file $CFG \
            -e VETH -e BRIDGE -e BRIDGE_NETFILTER -e NETFILTER_ADVANCED \
            -e NF_CONNTRACK -e NF_NAT -e NF_NAT_IPV4 -e NF_NAT_IPV6 \
            -e NETFILTER_XTABLES

          # ============ 5. iptables ============
          ./scripts/config --file $CFG \
            -e IP_NF_IPTABLES -e IP_NF_FILTER -e IP_NF_NAT -e IP_NF_MANGLE \
            -e IP_NF_RAW -e IP_NF_ARPTABLES -e IP_NF_TARGET_MASQUERADE \
            -e IP_NF_TARGET_REDIRECT \
            -e IP6_NF_IPTABLES -e IP6_NF_FILTER -e IP6_NF_NAT -e IP6_NF_MANGLE \
            -e IP6_NF_RAW -e IP6_NF_TARGET_MASQUERADE

          # ============ 6. Netfilter 扩展 ============
          ./scripts/config --file $CFG \
            -e NETFILTER_XT_MATCH_ADDRTYPE -e NETFILTER_XT_MATCH_CONNTRACK \
            -e NETFILTER_XT_MATCH_CONNMARK -e NETFILTER_XT_MATCH_MARK \
            -e NETFILTER_XT_MATCH_COMMENT -e NETFILTER_XT_MATCH_STATE \
            -e NETFILTER_XT_MATCH_MULTIPORT -e NETFILTER_XT_MATCH_IPRANGE \
            -e NETFILTER_XT_MATCH_LIMIT -e NETFILTER_XT_MATCH_MAC \
            -e NETFILTER_XT_MATCH_OWNER -e NETFILTER_XT_MATCH_PKTTYPE \
            -e NETFILTER_XT_MATCH_QUOTA -e NETFILTER_XT_MATCH_SOCKET \
            -e NETFILTER_XT_MATCH_TCPMSS -e NETFILTER_XT_MATCH_HL \
            -e NETFILTER_XT_MATCH_ESP -e NETFILTER_XT_MATCH_HELPER \
            -e NETFILTER_XT_MATCH_POLICY -e NETFILTER_XT_MATCH_STATISTIC \
            -e NETFILTER_XT_MATCH_STRING -e NETFILTER_XT_MATCH_TIME \
            -e NETFILTER_XT_MATCH_U32 -e NETFILTER_XT_MATCH_DSCP \
            -e NETFILTER_XT_MATCH_ECN -e NETFILTER_XT_MATCH_HASHLIMIT

          ./scripts/config --file $CFG \
            -e NETFILTER_XT_TARGET_MASQUERADE -e NETFILTER_XT_TARGET_REDIRECT \
            -e NETFILTER_XT_TARGET_MARK -e NETFILTER_XT_TARGET_NETMAP \
            -e NETFILTER_XT_TARGET_CONNMARK -e NETFILTER_XT_TARGET_CT \
            -e NETFILTER_XT_TARGET_HL -e NETFILTER_XT_TARGET_DSCP \
            -e NETFILTER_XT_TARGET_TCPMSS -e NETFILTER_XT_TARGET_CLASSIFY \
            -e NETFILTER_XT_TARGET_IDLETIMER -e NETFILTER_XT_TARGET_TRACE

          # ============ 7. IPVS ============
          ./scripts/config --file $CFG \
            -e IP_VS -e IP_VS_PROTO_TCP -e IP_VS_PROTO_UDP -e IP_VS_PROTO_SCTP \
            -e IP_VS_PROTO_AH -e IP_VS_PROTO_ESP \
            -e IP_VS_RR -e IP_VS_WRR -e IP_VS_LC -e IP_VS_WLC \
            -e IP_VS_FO -e IP_VS_OVF -e IP_VS_LBLC -e IP_VS_LBLCR \
            -e IP_VS_DH -e IP_VS_SH -e IP_VS_SED -e IP_VS_NQ -e IP_VS_NFCT

          # ============ 8. OverlayFS ============
          ./scripts/config --file $CFG \
            -e OVERLAY_FS -e OVERLAY_FS_REDIRECT_DIR -e OVERLAY_FS_INDEX

          # ============ 9. 文件系统 ============
          ./scripts/config --file $CFG \
            -e SQUASHFS -e SQUASHFS_XZ -e SQUASHFS_LZ4 -e SQUASHFS_ZSTD \
            -e EXT4_FS -e FUSE_FS -e TMPFS \
            -e BLK_DEV_LOOP -e BLK_DEV_NBD

          # ============ 10. Netlink ============
          ./scripts/config --file $CFG \
            -e NETLINK_DIAG -e INET_DIAG -e PACKET_DIAG -e UNIX_DIAG

          # ============ 11. Seccomp / BPF ============
          ./scripts/config --file $CFG \
            -e SECCOMP -e SECCOMP_FILTER -e BPF_SYSCALL \
            -e NET_SCHED -e NET_CLS_ACT -e NET_CLS_BPF -e NET_ACT_BPF

          # ============ 12. TUN/TAP ============
          ./scripts/config --file $CFG -e TUN -e TAP

          # ============ 13. veth 相关 ============
          ./scripts/config --file $CFG \
            -e NET_IPIP -e NET_IPGRE -e NET_IPGRE_DEMUX

          # 自动处理依赖（-gdwarf-4 关键）
          make O=out ARCH=arm64 SUBARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            KCFLAGS="-gdwarf-4" \
            olddefconfig

          echo ""
          echo "===== Container config check ====="
          grep -E "CONFIG_(NAMESPACES|NET_NS|PID_NS|IPC_NS|UTS_NS|USER_NS|SYSVIPC|POSIX_MQUEUE|CGROUPS|CGROUP_DEVICE|MEMCG|VETH|BRIDGE|OVERLAY_FS|IP_VS|DEVTMPFS|SQUASHFS|SECCOMP|BPF_SYSCALL)=" \
            out/.config || true

          echo ""
          echo "===== Netfilter 关键项 ====="
          grep -E "^CONFIG_(NETFILTER_XT_MATCH_ADDRTYPE|NETFILTER_XT_MATCH_CONNTRACK|NETFILTER_XT_MATCH_IPVS|NETFILTER_XT_TARGET_MASQUERADE|NETFILTER_XT_TARGET_REDIRECT|NETFILTER_XT_TARGET_MARK|NETFILTER_XT_MATCH_COMMENT|IP_NF_IPTABLES|IP_NF_NAT|IP_NF_FILTER|IP_NF_MANGLE|IP_NF_RAW|NF_NAT|NF_CONNTRACK|NETFILTER_ADVANCED|NETFILTER_XTABLES)" \
            out/.config || true

          echo ""
          echo "===== IPVS 协议 ====="
          grep -E "^CONFIG_IP_VS" out/.config || true

      # ============ 9. 禁用 DTBO overlay 编译 ============
      - name: Disable DTBO overlay compilation
        working-directory: ./kernel
        run: |
          find arch/arm64/boot/dts -name Makefile -print0 | \
            xargs -0 -I{} sed -i 's/^dtbo-/dtbo-DISABLED-/g' {}
          grep -rn "^dtbo-DISABLED-" arch/arm64/boot/dts/lge/Makefile | head -3 || true

      # ============ 10. 编译内核（ccache + zyc-clang + DWARF v4） ============
      - name: Build kernel
        working-directory: ./kernel
        run: |
          export PATH="/home/runner/zyc-clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"

          echo "===== Build 开始 ====="
          echo "时间: $(date)"
          echo "CCACHE_DIR=$CCACHE_DIR"
          which clang
          clang --version
          ccache -s

          START_TIME=$(date +%s)

          # KCFLAGS=-gdwarf-4 强制 clang 输出 DWARF v4
          make -j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KCFLAGS="-gdwarf-4" \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          echo ""
          echo "===== Build 结束 ====="
          echo "耗时: ${DURATION} 秒 ($((DURATION/60)) 分钟)"
          ccache -s

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "===== Build failed ====="
            tail -100 build.log
            exit 1
          fi

          echo "===== New kernel image ====="
          ls -lh out/arch/arm64/boot/Image.gz

          echo "===== 生成的模块列表 ====="
          find out -name "*.ko" | head -30 || true
          echo "模块总数: $(find out -name '*.ko' | wc -l)"

      # ============ 10.5 ccache 统计 ============
      - name: Show ccache stats after build
        if: always()
        run: |
          echo "===== 最终 ccache 统计 ====="
          ccache -s -v
          echo ""
          echo "===== 缓存目录大小 ====="
          du -sh "$CCACHE_DIR" 2>/dev/null || echo "无法获取"

      # ============ 11. 下载 mkbootimg 工具 ============
      - name: Fetch LineageOS mkbootimg tools
        run: |
          git clone --depth=1 -b lineage-22.2 \
            https://github.com/LineageOS/android_system_tools_mkbootimg \
            /tmp/lineage-mkbootimg
          ls -la /tmp/lineage-mkbootimg/*.py

      # ============ 12. 重打包 boot.img ============
      - name: Repack boot.img with new kernel
        shell: bash
        run: |
          set -e
          BOOT_SRC="${{ github.workspace }}/builder/${{ github.event.inputs.boot_img_path }}"
          BOOT_OUT="${{ github.workspace }}/boot-flashlmdd-container.img"
          KERNEL_NEW="${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz"
          WORK="/tmp/boot-work"
          TOOLS="/tmp/lineage-mkbootimg"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          UNPACK_OUT=$(python3 "$TOOLS/unpack_bootimg.py" \
            --boot_img "$BOOT_SRC" \
            --out "$WORK" 2>&1 | tee /dev/stderr)

          ls -la "$WORK/"

          HEADER_VERSION=$(echo "$UNPACK_OUT" | grep -i "boot image header version" | awk -F: '{print $2}' | tr -d ' ')
          KERNEL_OFFSET=$(echo "$UNPACK_OUT"  | grep -i "kernel load address"        | awk -F: '{print $2}' | tr -d ' ')
          RAMDISK_OFFSET=$(echo "$UNPACK_OUT" | grep -i "ramdisk load address"       | awk -F: '{print $2}' | tr -d ' ')
          SECOND_OFFSET=$(echo "$UNPACK_OUT"  | grep -i "second bootloader load address" | awk -F: '{print $2}' | tr -d ' ')
          TAGS_OFFSET=$(echo "$UNPACK_OUT"    | grep -i "kernel tags load address"   | awk -F: '{print $2}' | tr -d ' ')
          PAGESIZE=$(echo "$UNPACK_OUT"       | grep -i "^page size"                 | awk -F: '{print $2}' | tr -d ' ')
          OS_VERSION=$(echo "$UNPACK_OUT"     | grep -i "^os version"                | awk -F: '{print $2}' | tr -d ' ')
          OS_PATCH_LEVEL=$(echo "$UNPACK_OUT" | grep -i "^os patch level"            | awk -F: '{print $2}' | tr -d ' ')
          CMDLINE=$(echo "$UNPACK_OUT"        | grep -i "^command line args"         | sed 's/^[^:]*: *//')
          DTB_OFFSET=$(echo "$UNPACK_OUT"     | grep -i "^dtb address"               | awk -F: '{print $2}' | tr -d ' ')
          PRODUCT_NAME=$(echo "$UNPACK_OUT"   | grep -i "^product name"              | awk -F: '{print $2}' | sed 's/^ *//')

          BASE="0x00000000"

          cp "$KERNEL_NEW" "$WORK/kernel"

          ARGS=(
            --header_version "$HEADER_VERSION"
            --kernel "$WORK/kernel"
            --ramdisk "$WORK/ramdisk"
            --base "$BASE"
            --kernel_offset "$KERNEL_OFFSET"
            --ramdisk_offset "$RAMDISK_OFFSET"
            --second_offset "$SECOND_OFFSET"
            --tags_offset "$TAGS_OFFSET"
            --pagesize "$PAGESIZE"
          )

          DTB_SIZE=$(stat -c%s "$WORK/dtb" 2>/dev/null || echo 0)
          if [ "$DTB_SIZE" -gt 0 ]; then
            ARGS+=(--dtb "$WORK/dtb" --dtb_offset "$DTB_OFFSET")
          fi

          [ -n "$CMDLINE" ] && ARGS+=(--cmdline "$CMDLINE")
          [ -n "$OS_VERSION" ] && ARGS+=(--os_version "$OS_VERSION")
          [ -n "$OS_PATCH_LEVEL" ] && ARGS+=(--os_patch_level "$OS_PATCH_LEVEL")
          [ -n "$PRODUCT_NAME" ] && ARGS+=(--board "$PRODUCT_NAME")

          python3 "$TOOLS/mkbootimg.py" "${ARGS[@]}" --output "$BOOT_OUT"

          ls -lh "$BOOT_OUT"

          ORIG_SIZE=$(stat -c%s "$BOOT_SRC")
          NEW_SIZE=$(stat -c%s "$BOOT_OUT")
          echo "Original: $ORIG_SIZE  New: $NEW_SIZE"

          if [ "$NEW_SIZE" -lt "$ORIG_SIZE" ]; then
            PADDED="/tmp/boot-padded.img"
            cp "$BOOT_SRC" "$PADDED"
            dd if="$BOOT_OUT" of="$PADDED" conv=notrunc bs=1M status=progress
            mv "$PADDED" "$BOOT_OUT"
            echo "Padded to: $(stat -c%s "$BOOT_OUT")"
          fi

          echo "===== Final ====="
          ls -lh "$BOOT_OUT"

      # ============ 13. 上传 boot.img ============
      - name: Upload new boot.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-flashlmdd-container-${{ github.run_number }}
          path: ${{ github.workspace }}/boot-flashlmdd-container.img
          retention-days: 7

      # ============ 14. 上传日志 ============
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 7
