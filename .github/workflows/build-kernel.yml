name: Build Container-Supported Kernel (LG G8)

on:
    workflow_dispatch:
        inputs:
            kernel_branch:
                description: "Kernel branch to build"
                required: true
                default: "lineage-22.2"
            defconfig_path:
                description: "Path to defconfig (relative to kernel root)"
                required: true
                default: "vendor/lineageos_flash_defconfig"

env:
    KERNEL_REPO: "LineageOS/android_kernel_lge_sm8150"
    ARCH: arm64
    SUBARCH: arm64

jobs:
    build:
        runs-on: ubuntu-22.04
        timeout-minutes: 180

        steps:
            # ============ 1. 拉取内核源码 ============
            - name: Checkout kernel source
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.KERNEL_REPO }}
                  ref: ${{ github.event.inputs.kernel_branch }}
                  path: kernel
                  fetch-depth: 1

            # ============ 2. 安装编译依赖 ============
            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    bc bison build-essential ccache curl flex git gnupg gperf \
                    imagemagick lib32readline-dev lib32z1-dev libdw-dev libelf-dev \
                    libgnutls28-dev liblz4-tool libsdl1.2-dev libssl-dev \
                    libxml2 libxml2-utils lzop pngcrush rsync schedtool \
                    squashfs-tools xsltproc zip zlib1g-dev device-tree-compiler \
                    python3 python-is-python3 libncurses5-dev libncursesw5-dev
                  sudo apt-get install -y libncurses5 libtinfo5 || true

            # ============ 3. ccache 缓存 ============
            - name: Setup ccache
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: sm8150-${{ github.event.inputs.kernel_branch }}
                  max-size: 2G

            # ============ 4. 下载工具链 ============
            - name: Clone toolchains
              shell: bash
              run: |
                  # --- Clang：LineageOS 内核专用 clang-r416183b ---
                  git clone --depth=1 \
                    https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b \
                    /tmp/clang
                  echo "/tmp/clang/bin" >> $GITHUB_PATH

                  # --- GCC 4.9 ---
                  git clone --depth=1 \
                    https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
                    /tmp/gcc64
                  echo "/tmp/gcc64/bin" >> $GITHUB_PATH

                  git clone --depth=1 \
                    https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
                    /tmp/gcc32
                  echo "/tmp/gcc32/bin" >> $GITHUB_PATH

                  # --- 创建不带版本号的符号链接 ---
                  cd /tmp/gcc64/bin
                  for f in aarch64-linux-android-4.9-*; do
                    [ -e "$f" ] || continue
                    newname="${f/aarch64-linux-android-4.9-/aarch64-linux-android-}"
                    ln -sf "$f" "$newname"
                  done

                  cd /tmp/gcc32/bin
                  for f in arm-linux-androideabi-4.9-*; do
                    [ -e "$f" ] || continue
                    newname="${f/arm-linux-androideabi-4.9-/arm-linux-androideabi-}"
                    ln -sf "$f" "$newname"
                  done

                  echo "===== Toolchain check ====="
                  /tmp/clang/bin/clang --version || true
                  /usr/bin/dtc --version || true
                  ls -l /tmp/gcc64/bin/aarch64-linux-android-ld || true
                  ls -l /tmp/gcc32/bin/arm-linux-androideabi-ld || true

            # ============ 5. 配置 + 注入容器支持 ============
            - name: Configure kernel with container support
              working-directory: ./kernel
              run: |
                  export PATH="/tmp/clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"
                  export CC=clang
                  export CLANG_TRIPLE=aarch64-linux-gnu-
                  export CROSS_COMPILE=aarch64-linux-android-
                  export CROSS_COMPILE_ARM32=arm-linux-androideabi-

                  make O=out ARCH=arm64 SUBARCH=arm64 \
                    ${{ github.event.inputs.defconfig_path }}

                  CFG="out/.config"

                  # 防御性：禁用 DWARF v5 默认选项
                  ./scripts/config --file $CFG -d DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT

                  # Namespaces
                  ./scripts/config --file $CFG \
                    -e NAMESPACES -e NET_NS -e PID_NS -e IPC_NS -e UTS_NS -e USER_NS

                  # Cgroups
                  ./scripts/config --file $CFG \
                    -e CGROUPS -e CGROUP_DEVICE -e CGROUP_HUGETLB -e NET_CLS_CGROUP \
                    -e CGROUP_FREEZER -e CGROUP_SCHED -e CPUSETS -e MEMCG

                  # 网络
                  ./scripts/config --file $CFG \
                    -e VETH -e BRIDGE -e BRIDGE_NETFILTER -e NF_NAT \
                    -e NETFILTER_XT_MATCH_ADDRTYPE -e NETFILTER_XT_MATCH_CONNTRACK \
                    -e NETFILTER_XT_MATCH_IPVS -e NETFILTER_XT_MARK \
                    -e NETFILTER_XT_NAT -e NETFILTER_XT_TARGET_MASQUERADE \
                    -e NETFILTER_XT_TARGET_REDIRECT -e IP_VS

                  # OverlayFS
                  ./scripts/config --file $CFG -e OVERLAY_FS

                  # 模块
                  ./scripts/config --file $CFG \
                    -m NETFILTER_XT_MATCH_ADDRTYPE \
                    -m NETFILTER_XT_MATCH_CONNTRACK \
                    -m NETFILTER_XT_MATCH_IPVS

                  make O=out ARCH=arm64 SUBARCH=arm64 olddefconfig

                  echo "===== Container-related config check ====="
                  grep -E "CONFIG_(NAMESPACES|NET_NS|PID_NS|IPC_NS|UTS_NS|USER_NS|CGROUPS|CGROUP_DEVICE|MEMCG|VETH|BRIDGE|OVERLAY_FS|IP_VS)=" \
                    out/.config || true

            # ============ 6. 禁用 DTBO overlay 编译 ============
            - name: Disable DTBO overlay compilation
              working-directory: ./kernel
              run: |
                  # LGE 的 dtsi 用了内核自带 DTC 不支持的语法，跳过所有 dtbo overlay
                  # 主 dtb 已内嵌进 Image.gz-dtb，overlay 不是必须的
                  find arch/arm64/boot/dts -name Makefile -print0 | \
                    xargs -0 -I{} sed -i 's/^dtbo-/dtbo-DISABLED-/g' {}

                  echo "===== Verify dtbo lines disabled ====="
                  grep -rn "^dtbo-DISABLED-" arch/arm64/boot/dts/lge/Makefile | head -5 || true

            # ============ 7. 编译内核 ============
            - name: Build kernel
              working-directory: ./kernel
              run: |
                  export PATH="/tmp/clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"
                  export CC=clang
                  export CLANG_TRIPLE=aarch64-linux-gnu-
                  export CROSS_COMPILE=aarch64-linux-android-
                  export CROSS_COMPILE_ARM32=arm-linux-androideabi-

                  make -j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 \
                    CC=clang \
                    CLANG_TRIPLE=aarch64-linux-gnu- \
                    CROSS_COMPILE=aarch64-linux-android- \
                    CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                    2>&1 | tee build.log

                  if [ ${PIPESTATUS[0]} -ne 0 ]; then
                    echo "===== Build failed, last 80 lines ====="
                    tail -80 build.log
                    exit 1
                  fi

            # ============ 8. 上传构建日志 ============
            - name: Upload build log
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: build-log-${{ github.run_number }}
                  path: kernel/build.log
                  retention-days: 7

            # ============ 9. 打包成 AnyKernel3 ============
            - name: Package with AnyKernel3
              if: success()
              run: |
                  git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/AnyKernel3
                  cd /tmp/AnyKernel3

                  cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz-dtb .

                  # dtbo 被禁用了，所以不再拷贝 dtbo.img，避免刷入不匹配的 overlay
                  # if [ -f ${{ github.workspace }}/kernel/out/arch/arm64/boot/dtbo.img ]; then
                  #   cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/dtbo.img .
                  # fi

                  rm -rf .git
                  zip -r9 kernel-flashlmdd-container.zip . -x "*.git*"

            # ============ 10. 上传刷机包 ============
            - name: Upload kernel package
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: kernel-flashlmdd-container-${{ github.run_number }}
                  path: /tmp/AnyKernel3/kernel-flashlmdd-container.zip
                  retention-days: 7
