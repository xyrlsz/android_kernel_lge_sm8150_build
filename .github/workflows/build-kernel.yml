name: Build Container-Supported Kernel (LG V50) + boot.img Repack

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch to build"
        required: true
        default: "lineage-22.2"
      defconfig_path:
        description: "Path to defconfig (relative to kernel root)"
        required: true
        default: "vendor/lineageos_flash_defconfig"
      boot_img_path:
        description: "Path to prebuilt boot.img in this repo"
        required: true
        default: "prebuilt/boot.img"

env:
  KERNEL_REPO: "LineageOS/android_kernel_lge_sm8150"
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_DIR: /home/runner/.cache/ccache-kernel
  ZYC_CLANG_VERSION: "16.0.6-20260807"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ============ 1. 拉取本仓库 ============
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Verify boot.img exists
        run: |
          BOOT="${{ github.workspace }}/builder/${{ github.event.inputs.boot_img_path }}"
          if [ ! -f "$BOOT" ]; then
            echo "::error::boot.img not found at $BOOT"
            ls -laR ${{ github.workspace }}/builder/ | head -50
            exit 1
          fi
          echo "===== Original boot.img ====="
          ls -lh "$BOOT"
          file "$BOOT" || true

      # ============ 2. 拉取内核源码 ============
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ github.event.inputs.kernel_branch }}
          path: kernel
          fetch-depth: 1

      # ============ 3. 安装编译依赖 ============
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            lib32readline-dev lib32z1-dev libdw-dev libelf-dev \
            libgnutls28-dev liblz4-tool libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev unzip \
            python3 python-is-python3 python3-pip \
            libncurses5 libtinfo5

          echo "===== ccache version ====="
          ccache --version | head -1

      # ============ 4. ccache 缓存 ============
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache-kernel
          key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.kernel_branch }}-${{ env.ZYC_CLANG_VERSION }}-dwarf4-patch-v4-${{ hashFiles('kernel/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.kernel_branch }}-${{ env.ZYC_CLANG_VERSION }}-dwarf4-
            ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.kernel_branch }}-${{ env.ZYC_CLANG_VERSION }}-
            ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.kernel_branch }}-

      - name: Setup ccache environment
        shell: bash
        run: |
          mkdir -p "$CCACHE_DIR"
          {
            echo "CCACHE_DIR=$CCACHE_DIR"
            echo "CCACHE_MAXSIZE=5G"
            echo "CCACHE_COMPRESS=true"
            echo "CCACHE_COMPRESSLEVEL=6"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_ctime,include_file_mtime"
            echo "CCACHE_CPP2=true"
            echo "CCACHE_DEPEND=true"
          } >> $GITHUB_ENV

      # ============ 5. 下载 zyc-clang 工具链 ============
      - name: Setup zyc-clang toolchain
        shell: bash
        run: |
          mkdir -p /home/runner/zyc-clang
          cd /home/runner/zyc-clang
          wget -q \
            "https://github.com/ZyCromerZ/Clang/releases/download/${ZYC_CLANG_VERSION}-release/Clang-${ZYC_CLANG_VERSION}.tar.gz" \
            -O zyc-clang.tar.gz
          tar -zxf zyc-clang.tar.gz
          rm zyc-clang.tar.gz
          /home/runner/zyc-clang/bin/clang --version
          echo "/home/runner/zyc-clang/bin" >> $GITHUB_PATH

      # ============ 6. 下载 GCC 4.9 工具链 ============
      - name: Clone GCC 4.9 toolchains
        shell: bash
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            /tmp/gcc64
          echo "/tmp/gcc64/bin" >> $GITHUB_PATH
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            /tmp/gcc32
          echo "/tmp/gcc32/bin" >> $GITHUB_PATH

          cd /tmp/gcc64/bin
          for f in aarch64-linux-android-4.9-*; do
            [ -e "$f" ] || continue
            ln -sf "$f" "${f/aarch64-linux-android-4.9-/aarch64-linux-android-}"
          done
          cd /tmp/gcc32/bin
          for f in arm-linux-androideabi-4.9-*; do
            [ -e "$f" ] || continue
            ln -sf "$f" "${f/arm-linux-androideabi-4.9-/arm-linux-androideabi-}"
          done

      # ============ 7. 验证工具链 ============
      - name: Verify toolchain
        shell: bash
        run: |
          export PATH="/home/runner/zyc-clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"
          which clang
          clang --version
          which aarch64-linux-android-ld
          which arm-linux-androideabi-ld

      # ============ 8. 配置内核 ============
      - name: Configure kernel
        working-directory: ./kernel
        run: |
          export PATH="/home/runner/zyc-clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out ARCH=arm64 SUBARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            KCFLAGS="-gdwarf-4" \
            ${{ github.event.inputs.defconfig_path }}

          CFG="out/.config"

          # ============================================
          # 1. 32位应用支持
          # ============================================
          ./scripts/config --file $CFG \
            -e COMPAT -e COMPAT_32BIT_TIME \
            -e KUSER_HELPERS -e COMPAT_VDSO

          # ============================================
          # 2. Namespaces
          # ============================================
          ./scripts/config --file $CFG \
            -e NAMESPACES -e NET_NS -e PID_NS -e UTS_NS -e USER_NS \
            -e SYSVIPC -e POSIX_MQUEUE -e IPC_NS -e SYSCTL

          # ============================================
          # 3. Cgroups
          # ============================================
          ./scripts/config --file $CFG \
            -e CGROUPS -e CGROUP_DEVICE -e CGROUP_PIDS -e MEMCG \
            -e CGROUP_SCHED -e FAIR_GROUP_SCHED -e CGROUP_FREEZER \
            -e CGROUP_NET_PRIO -e CGROUP_HUGETLB -e NET_CLS_CGROUP \
            -e CGROUP_BPF -e CPUSETS

          # ============================================
          # 4. 网络基础 + Droidspaces 网络隔离
          # ============================================
          ./scripts/config --file $CFG \
            -e NETFILTER -e VETH -e BRIDGE -e BRIDGE_NETFILTER \
            -e NETFILTER_ADVANCED -e NF_CONNTRACK -e NF_NAT -e NF_TABLES \
            -e IP_NF_IPTABLES -e IP_NF_FILTER -e IP_NF_NAT -e IP_NF_MANGLE \
            -e IP_NF_RAW -e IP_NF_ARPTABLES -e IP_NF_TARGET_MASQUERADE \
            -e IP_NF_TARGET_REDIRECT -e IP6_NF_IPTABLES -e IP6_NF_FILTER \
            -e IP6_NF_NAT -e IP6_NF_MANGLE -e IP6_NF_RAW \
            -e IP6_NF_TARGET_MASQUERADE \
            -e NETFILTER_XT_TARGET_MASQUERADE -e NETFILTER_XT_TARGET_TCPMSS \
            -e NETFILTER_XT_MATCH_ADDRTYPE -e NF_CONNTRACK_NETLINK \
            -e NF_NAT_REDIRECT -e IP_ADVANCED_ROUTER -e IP_MULTIPLE_TABLES \
            -e NF_CONNTRACK_IPV4 -e NF_NAT_IPV4 -e NETFILTER_XTABLES

          # 关键：禁用 ANDROID_PARANOID_NETWORK，否则容器内无法联网
          ./scripts/config --file $CFG -d ANDROID_PARANOID_NETWORK

          # ============================================
          # 5. Netfilter 扩展
          # ============================================
          ./scripts/config --file $CFG \
            -e NETFILTER_XT_MATCH_CONNTRACK -e NETFILTER_XT_MATCH_CONNMARK \
            -e NETFILTER_XT_MATCH_MARK -e NETFILTER_XT_MATCH_COMMENT \
            -e NETFILTER_XT_MATCH_STATE -e NETFILTER_XT_MATCH_MULTIPORT \
            -e NETFILTER_XT_MATCH_IPRANGE -e NETFILTER_XT_MATCH_LIMIT \
            -e NETFILTER_XT_MATCH_MAC -e NETFILTER_XT_MATCH_OWNER \
            -e NETFILTER_XT_MATCH_PKTTYPE -e NETFILTER_XT_MATCH_QUOTA \
            -e NETFILTER_XT_MATCH_SOCKET -e NETFILTER_XT_MATCH_TCPMSS \
            -e NETFILTER_XT_MATCH_HL -e NETFILTER_XT_MATCH_ESP \
            -e NETFILTER_XT_MATCH_HELPER -e NETFILTER_XT_MATCH_POLICY \
            -e NETFILTER_XT_MATCH_STATISTIC -e NETFILTER_XT_MATCH_STRING \
            -e NETFILTER_XT_MATCH_TIME -e NETFILTER_XT_MATCH_U32 \
            -e NETFILTER_XT_MATCH_DSCP -e NETFILTER_XT_MATCH_ECN \
            -e NETFILTER_XT_MATCH_HASHLIMIT \
            -e NETFILTER_XT_TARGET_MARK -e NETFILTER_XT_TARGET_NETMAP \
            -e NETFILTER_XT_TARGET_CONNMARK -e NETFILTER_XT_TARGET_CT \
            -e NETFILTER_XT_TARGET_HL -e NETFILTER_XT_TARGET_DSCP \
            -e NETFILTER_XT_TARGET_CLASSIFY -e NETFILTER_XT_TARGET_IDLETIMER \
            -e NETFILTER_XT_TARGET_TRACE

          # ============================================
          # 6. IPVS
          # ============================================
          ./scripts/config --file $CFG \
            -e IP_VS -e IP_VS_PROTO_TCP -e IP_VS_PROTO_UDP -e IP_VS_PROTO_SCTP \
            -e IP_VS_PROTO_AH -e IP_VS_PROTO_ESP -e IP_VS_RR -e IP_VS_WRR \
            -e IP_VS_LC -e IP_VS_WLC -e IP_VS_FO -e IP_VS_OVF \
            -e IP_VS_LBLC -e IP_VS_LBLCR -e IP_VS_DH -e IP_VS_SH \
            -e IP_VS_SED -e IP_VS_NQ -e IP_VS_NFCT

          # ============================================
          # 7. OverlayFS + 文件系统
          # ============================================
          ./scripts/config --file $CFG \
            -e OVERLAY_FS -e OVERLAY_FS_REDIRECT_DIR -e OVERLAY_FS_INDEX \
            -e SQUASHFS -e SQUASHFS_XZ -e SQUASHFS_LZ4 -e SQUASHFS_ZSTD \
            -e EXT4_FS -e FUSE_FS -e TMPFS -e TMPFS_POSIX_ACL -e TMPFS_XATTR \
            -e BLK_DEV_LOOP -e BLK_DEV_NBD -e DEVTMPFS -e DEVTMPFS_MOUNT

          # ============================================
          # 8. Netlink + Seccomp + BPF + TUN/TAP
          # ============================================
          ./scripts/config --file $CFG \
            -e NETLINK_DIAG -e INET_DIAG -e PACKET_DIAG -e UNIX_DIAG \
            -e SECCOMP -e SECCOMP_FILTER -e BPF_SYSCALL \
            -e NET_SCHED -e NET_CLS_ACT -e NET_CLS_BPF -e NET_ACT_BPF \
            -e TUN -e TAP -e NET_IPIP -e NET_IPGRE -e NET_IPGRE_DEMUX

          # ============================================
          # 9. 固件加载
          # ============================================
          ./scripts/config --file $CFG \
            -e FW_LOADER -e FW_LOADER_USER_HELPER -e FW_LOADER_COMPRESS

          # 自动处理依赖
          make O=out ARCH=arm64 SUBARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            KCFLAGS="-gdwarf-4" \
            olddefconfig

          echo ""
          echo "===== 关键配置检查 ====="
          grep -E "CONFIG_(COMPAT|KUSER_HELPERS|COMPAT_VDSO)=" out/.config || true

          echo ""
          echo "===== Container config check ====="
          grep -E "CONFIG_(NAMESPACES|NET_NS|PID_NS|IPC_NS|UTS_NS|USER_NS|SYSVIPC|POSIX_MQUEUE|CGROUPS|CGROUP_DEVICE|MEMCG|VETH|BRIDGE|OVERLAY_FS|IP_VS|DEVTMPFS|SQUASHFS|SECCOMP|BPF_SYSCALL)=" out/.config || true

      # ============ 8.5 应用 Droidspaces non-GKI 补丁 ============
      - name: Apply Droidspaces non-GKI patches
        working-directory: ./kernel
        shell: bash
        run: |
          echo "======================================"
          echo "===== 应用 Droidspaces non-GKI 补丁 ====="
          echo "======================================"

          PATCH_DIR="/tmp/droidspaces-patches"
          mkdir -p "$PATCH_DIR"

          echo "===== 下载补丁 ====="
          curl -L --retry 3 --retry-delay 5 -o "$PATCH_DIR/01.fix_xt_qtaguid_panic.patch" \
            "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch" || true
          curl -L --retry 3 --retry-delay 5 -o "$PATCH_DIR/02.fix_cgroup_prefix.patch" \
            "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch" || true

          echo "===== 下载结果 ====="
          ls -la "$PATCH_DIR/"

          echo ""
          echo "===== 逐个应用补丁（dry-run 通过才应用）====="
          APPLIED=0
          SKIPPED=0

          for patch_file in "$PATCH_DIR"/*.patch; do
            [ -f "$patch_file" ] || continue

            PATCH_NAME=$(basename "$patch_file")
            echo ""
            echo "----- 检查: $PATCH_NAME -----"

            # 文件有效性检查
            if [ ! -s "$patch_file" ]; then
              echo "⚠ 补丁文件为空，跳过"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # 检查是否是 HTML 错误页（下载失败）
            if head -c 100 "$patch_file" | grep -qi "<!DOCTYPE\|<html"; then
              echo "⚠ 补丁下载得到 HTML 页面（URL 失效），跳过"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # dry-run：只有干净应用才真正应用
            if patch -p1 --dry-run < "$patch_file" > /dev/null 2>&1; then
              echo "✓ Dry-run 通过，正式应用..."
              patch -p1 < "$patch_file"
              APPLIED=$((APPLIED + 1))
              echo "✓ $PATCH_NAME 应用成功"
            else
              echo "⚠ Dry-run 失败（补丁上下文与本内核不匹配），跳过此补丁"
              echo "   这是正常现象：Droidspaces 官方补丁针对特定内核版本，"
              echo "   你的内核已被 LG/LineageOS 修改过，上下文可能不一致。"
              SKIPPED=$((SKIPPED + 1))
            fi
          done

          echo ""
          echo "===== 补丁应用总结 ====="
          echo "已应用: $APPLIED 个"
          echo "已跳过: $SKIPPED 个"
          echo ""
          echo "===== 补丁步骤完成 ====="

      # ============ 9. 禁用 DTBO overlay 编译 ============
      - name: Disable DTBO overlay compilation
        working-directory: ./kernel
        run: |
          find arch/arm64/boot/dts -name Makefile -print0 | \
            xargs -0 -I{} sed -i 's/^dtbo-/dtbo-DISABLED-/g' {}
          grep -rn "^dtbo-DISABLED-" arch/arm64/boot/dts/lge/Makefile | head -3 || true

      # ============ 10. 编译内核 ============
      - name: Build kernel
        working-directory: ./kernel
        run: |
          export PATH="/home/runner/zyc-clang/bin:/tmp/gcc64/bin:/tmp/gcc32/bin:$PATH"

          echo "===== Build 开始 ====="
          echo "时间: $(date)"
          ccache -s

          START_TIME=$(date +%s)

          make -j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KCFLAGS="-gdwarf-4" \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          echo ""
          echo "===== Build 结束 ====="
          echo "耗时: ${DURATION} 秒 ($((DURATION/60)) 分钟)"
          ccache -s

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "===== Build failed ====="
            tail -100 build.log
            exit 1
          fi

          ls -lh out/arch/arm64/boot/Image.gz
          find out -name "*.ko" | head -30 || true
          echo "模块总数: $(find out -name '*.ko' | wc -l)"

      # ============ 10.5 ccache 统计 ============
      - name: Show ccache stats after build
        if: always()
        run: |
          echo "===== 最终 ccache 统计 ====="
          ccache -s -v
          echo ""
          echo "===== 缓存目录大小 ====="
          du -sh "$CCACHE_DIR" 2>/dev/null || echo "无法获取"

      # ============ 11. 下载 mkbootimg 工具 ============
      - name: Fetch LineageOS mkbootimg tools
        run: |
          git clone --depth=1 -b lineage-22.2 \
            https://github.com/LineageOS/android_system_tools_mkbootimg \
            /tmp/lineage-mkbootimg
          ls -la /tmp/lineage-mkbootimg/*.py

      # ============ 12. 重打包 boot.img ============
      - name: Repack boot.img with new kernel
        shell: bash
        run: |
          set -e
          BOOT_SRC="${{ github.workspace }}/builder/${{ github.event.inputs.boot_img_path }}"
          BOOT_OUT="${{ github.workspace }}/boot-flashlmdd-container.img"
          KERNEL_NEW="${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz"
          WORK="/tmp/boot-work"
          TOOLS="/tmp/lineage-mkbootimg"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          UNPACK_OUT=$(python3 "$TOOLS/unpack_bootimg.py" \
            --boot_img "$BOOT_SRC" \
            --out "$WORK" 2>&1 | tee /dev/stderr)

          HEADER_VERSION=$(echo "$UNPACK_OUT" | grep -i "boot image header version" | awk -F: '{print $2}' | tr -d ' ')
          KERNEL_OFFSET=$(echo "$UNPACK_OUT"  | grep -i "kernel load address"        | awk -F: '{print $2}' | tr -d ' ')
          RAMDISK_OFFSET=$(echo "$UNPACK_OUT" | grep -i "ramdisk load address"       | awk -F: '{print $2}' | tr -d ' ')
          SECOND_OFFSET=$(echo "$UNPACK_OUT"  | grep -i "second bootloader load address" | awk -F: '{print $2}' | tr -d ' ')
          TAGS_OFFSET=$(echo "$UNPACK_OUT"    | grep -i "kernel tags load address"   | awk -F: '{print $2}' | tr -d ' ')
          PAGESIZE=$(echo "$UNPACK_OUT"       | grep -i "^page size"                 | awk -F: '{print $2}' | tr -d ' ')
          OS_VERSION=$(echo "$UNPACK_OUT"     | grep -i "^os version"                | awk -F: '{print $2}' | tr -d ' ')
          OS_PATCH_LEVEL=$(echo "$UNPACK_OUT" | grep -i "^os patch level"            | awk -F: '{print $2}' | tr -d ' ')
          CMDLINE=$(echo "$UNPACK_OUT"        | grep -i "^command line args"         | sed 's/^[^:]*: *//')
          DTB_OFFSET=$(echo "$UNPACK_OUT"     | grep -i "^dtb address"               | awk -F: '{print $2}' | tr -d ' ')
          PRODUCT_NAME=$(echo "$UNPACK_OUT"   | grep -i "^product name"              | awk -F: '{print $2}' | sed 's/^ *//')

          BASE="0x00000000"

          cp "$KERNEL_NEW" "$WORK/kernel"

          ARGS=(
            --header_version "$HEADER_VERSION"
            --kernel "$WORK/kernel"
            --ramdisk "$WORK/ramdisk"
            --base "$BASE"
            --kernel_offset "$KERNEL_OFFSET"
            --ramdisk_offset "$RAMDISK_OFFSET"
            --second_offset "$SECOND_OFFSET"
            --tags_offset "$TAGS_OFFSET"
            --pagesize "$PAGESIZE"
          )

          DTB_SIZE=$(stat -c%s "$WORK/dtb" 2>/dev/null || echo 0)
          if [ "$DTB_SIZE" -gt 0 ]; then
            ARGS+=(--dtb "$WORK/dtb" --dtb_offset "$DTB_OFFSET")
          fi

          [ -n "$CMDLINE" ] && ARGS+=(--cmdline "$CMDLINE")
          [ -n "$OS_VERSION" ] && ARGS+=(--os_version "$OS_VERSION")
          [ -n "$OS_PATCH_LEVEL" ] && ARGS+=(--os_patch_level "$OS_PATCH_LEVEL")
          [ -n "$PRODUCT_NAME" ] && ARGS+=(--board "$PRODUCT_NAME")

          python3 "$TOOLS/mkbootimg.py" "${ARGS[@]}" --output "$BOOT_OUT"

          ls -lh "$BOOT_OUT"

          ORIG_SIZE=$(stat -c%s "$BOOT_SRC")
          NEW_SIZE=$(stat -c%s "$BOOT_OUT")
          echo "Original: $ORIG_SIZE  New: $NEW_SIZE"

          if [ "$NEW_SIZE" -lt "$ORIG_SIZE" ]; then
            PADDED="/tmp/boot-padded.img"
            cp "$BOOT_SRC" "$PADDED"
            dd if="$BOOT_OUT" of="$PADDED" conv=notrunc bs=1M status=progress
            mv "$PADDED" "$BOOT_OUT"
            echo "Padded to: $(stat -c%s "$BOOT_OUT")"
          fi

          echo "===== Final ====="
          ls -lh "$BOOT_OUT"

      # ============ 13. 上传 boot.img ============
      - name: Upload new boot.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-flashlmdd-container-${{ github.run_number }}
          path: ${{ github.workspace }}/boot-flashlmdd-container.img
          retention-days: 7

      # ============ 14. 上传日志 ============
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 7
